name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOFLAGS: "-buildvcs=false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go 1.26.0
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run staticcheck
        run: make lint

      - name: Run tests
        run: make test

      - name: Run race tests
        run: make race

      - name: Build native shared library
        run: make build

      # GLIBC_ENFORCE=0: an Ubuntu-built binary is not a manylinux2014
      # artifact, so CI exercises packaging without the GLIBC 2.17 gate. The
      # pinned manylinux release jobs keep the strict default gate.
      - name: Package native release artifact (GLIBC gate skipped on Ubuntu)
        run: make package GLIBC_ENFORCE=0

      - name: Verify archive layout and checksum
        run: make check-release

      - name: Check smoke script syntax
        run: bash -n scripts/smoke-test.sh

      # Mirrors the monorepo's .github/workflows/reset-priority-ci.yml, which
      # is the one GitHub runs: the API credit router inside pinned CPA v8.0.4,
      # then its per-pick cost, reported and never gated.
      - name: API credit router inside real CPA (pinned v8.0.4)
        run: |
          docker pull eceasy/cli-proxy-api@sha256:72205ea2dff7e3e3ef23b03de4e17b169ff7449c02b12f2924a3d4d3eee68b7d
          make smoke

      - name: Router Pick benchmark (reported, not gated)
        run: make bench
