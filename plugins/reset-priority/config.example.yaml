# Merge this example into your existing CLIProxyAPI config.yaml.
# Do not replace unrelated routing, auth, logging, model, or management settings.

# Recommended for the plugin's hard-priority policy. If this already exists,
# keep the operator's existing routing section and change only with intent.
routing:
  strategy: "fill-first"

plugins:
  enabled: true
  dir: "plugins"

  # Custom registry for this plugin. The built-in official registry remains
  # available. Remove this source after moving to an official-store entry.
  store-sources:
    - "https://raw.githubusercontent.com/NoorChasib/cpa-plugins/main/registry.json"

  configs:
    reset-priority:
      enabled: true

      # CPA plugin registration/load priority. This is NOT an OAuth credential
      # priority and is not used by the reset-ranking algorithm.
      priority: 10

      # Full safety reconciliation. Exact reset deadlines use independent timers.
      # In standalone mode every pass makes one provider request per account,
      # so do not shorten it there. With use-quota-cache each pass reads only
      # the local snapshot.
      reconcile-interval: 1h
      request-timeout: 10s

      # Healthy credential priorities: 100, 200, 300, ...
      priority-floor: 100
      priority-step: 100

      # Managed credentials outside the active pool: disabled, reauth-required,
      # or recovering without a fresh post-recovery weekly reset observation.
      quarantine-priority: 0

      manage-claude: true
      manage-codex: true

      # Required first-install posture. Change to false only after status and logs
      # show the expected ordering for every real account.
      dry-run: true

      # Time zone for timestamps on the HTML status view only. Accepts an IANA
      # name such as America/Los_Angeles or Europe/Berlin, or "local" for the
      # CPA host zone. Unknown names fall back to UTC with a status warning.
      # The JSON status route always reports RFC3339 UTC.
      display-timezone: UTC

      # v0.1.0 does not perform active Codex reset-window activation. Setting
      # this true is accepted but ignored with a warning; passive reads/retries
      # remain enabled.
      codex-reset-window-activation: false

      # Equivalent provider-selection alias, if preferred instead of manage-*:
      # providers:
      #   - claude
      #   - codex

# Optional shared quota observations (off by default):
# Set plugins.configs.reset-priority.use-quota-cache: true
# Optional custom snapshot path: quota-cache-path: /CLIProxyAPI/plugins/data/quota-cache/snapshot.json
# Enabled cache mode waits for fresh observations; it never falls back to direct requests.
# After each reconciliation, accounts with no usable cache entry yet (for example
# after a CPA restart) are re-read from the local snapshot at +5s, +30s, +2m, +5m,
# and +15m. These are file reads, not provider requests. The corrected order is
# written once, when every account is confirmed or at the +15m step.
# Explicit use-quota-cache: false overrides any saved quota-cache-path.
