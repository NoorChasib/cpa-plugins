# Merge these fields into existing plugin configuration; preserve all other options.
plugins:
  enabled: true
  configs:
    quota-glance:
      enabled: true
      # Must match quota-cache's own cache-path. quota-glance never polls a
      # provider; it reads what quota-cache already collected.
      cache-path: /CLIProxyAPI/plugins/data/quota-cache/snapshot.json
      data-dir: /CLIProxyAPI/plugins/data/quota-glance
      # There is no password or token to set. The dashboard authenticates as
      # whoever is signed in to the CPA management console, and the quota
      # document sits behind the management key CPA already checks.
      # Age at which an observation is shown with a staleness badge.
      stale-after: 45m
      # Optional. Plan names are already display-ready: Claude reports "Max"
      # and "Team", and Codex's plan enum is mapped to the name the tier is
      # sold under ("pro" -> "Pro 20x", "prolite" -> "Pro 5x"). Override only
      # if a provider renames a tier before this plugin catches up.
      # plan-labels:
      #   pro: "Pro 20x"
    quota-cache:
      # quota-glance requires quota-cache 0.1.5 or newer for the full
      # session / weekly / weekly-fable layout. Against an older snapshot it
      # shows a single weekly row and fills in the rest once quota-cache
      # supplies canonical windows.
      enabled: true
      cache-path: /CLIProxyAPI/plugins/data/quota-cache/snapshot.json
