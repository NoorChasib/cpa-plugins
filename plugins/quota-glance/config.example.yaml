# Merge these fields into existing plugin configuration; preserve all other options.
plugins:
  enabled: true
  configs:
    quota-glance:
      enabled: true
      # Must match quota-cache's own cache-path. quota-glance never polls a
      # provider; it reads what quota-cache already collected.
      cache-path: /CLIProxyAPI/plugins/data/quota-cache/snapshot.json
      data-dir: /CLIProxyAPI/plugins/data/quota-glance
      # The dashboard password, for a browser with no remembered CPA console
      # session — a phone, a bookmark, the menu bar app. A browser that has
      # one, such as the console sidebar with Remember password ticked, needs
      # none; a browser that has both uses this.
      #
      # It also spends banked resets while allow-redeem is on, so treat it as
      # a password: anyone holding it can view the dashboard and use a reset.
      # A wrong one never counts toward CPA's management IP ban.
      #
      # Set it to a password of your choosing, at least 20 random characters.
      # Left empty, one is generated and printed once in the CPA log at
      # startup, then persisted under data-dir so restarts keep it.
      web-token: ""
      # Age at which an observation is shown with a staleness badge.
      stale-after: 45m
      # Using a banked Codex or Claude rate-limit reset from the dashboard.
      # Default true. This is the one thing quota-glance does that reaches a
      # provider, it happens only when you press the button and confirm, and
      # it cannot be undone — spending one clears that account's session and
      # weekly windows.
      #
      # It governs both ways in: a console session and the dashboard password
      # spend through the same plugin, so this switches both off together.
      # Set false to keep the count and the expiry on the card and remove the
      # button. The plugin then has no code path to a provider at all.
      allow-redeem: true
      # The OpenRouter balance, in dollars, below which its card turns amber.
      # Default 5; the card turns red once nothing is left whatever this says,
      # and 0 keeps it green until then. The card appears only when
      # quota-cache has an openrouter-management-key (0.1.9 or newer).
      openrouter-warn-below: 5
      # Optional. Plan names are already display-ready: each provider's plan
      # token is mapped to the name the tier is sold under — Codex "pro" ->
      # "Pro 200", "prolite" -> "Pro 100"; Claude "max_20x" -> "Max 20x",
      # "team" -> "Team" — and Grok's own display name passes through.
      # Override only if a provider renames a tier before this plugin catches
      # up. Prefix a key with the provider id to rename one provider's value
      # ("codex:pro", "claude:pro"; Grok's id is xai, as in "xai:supergrok").
      # A key without a prefix applies on every provider, Grok included,
      # except to Claude's pro, team, free and enterprise: Codex sends those
      # same tokens for different tiers, so an unprefixed key for one of them
      # is taken as written for Codex, and renaming Claude's needs
      # "claude:pro".
      # plan-labels:
      #   "codex:pro": "Pro 200"
      #   prolite: "Pro 100"
    quota-cache:
      # quota-glance requires quota-cache 0.1.6 or newer for the full
      # session / weekly / weekly-fable layout: Anthropic moved model-scoped
      # allowances into a structured limits[] array and nulled the flat keys,
      # and 0.1.6 is the release that reads both. Against an older snapshot it
      # shows a single weekly row and fills in the rest once quota-cache
      # supplies canonical windows.
      enabled: true
      cache-path: /CLIProxyAPI/plugins/data/quota-cache/snapshot.json
      # Optional: an OpenRouter management key for the balance card. See
      # quota-cache's README before adding one; it is a powerful key.
      # openrouter-management-key: sk-or-v1-...
