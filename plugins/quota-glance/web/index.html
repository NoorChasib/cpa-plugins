<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <!-- The plugin serves this page unauthenticated on a public resource route;
         it carries no data and authenticates as whoever is signed in to the CPA
         console. Keep it out of search results, and out of any Referer header:
         it runs with the console's management key in scope. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Quota Glance</title>
    <!-- Inlined, so the browser never asks for /favicon.ico. That request
         would be same-origin and harmless, but it would 404 in the CPA log
         on every visit, and "one document request" should mean one. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23181a1e'/%3E%3Crect%20x='6'%20y='8'%20%20width='20'%20height='3.5'%20rx='1.75'%20fill='%2323262c'/%3E%3Crect%20x='6'%20y='14'%20width='20'%20height='3.5'%20rx='1.75'%20fill='%2323262c'/%3E%3Crect%20x='6'%20y='20'%20width='20'%20height='3.5'%20rx='1.75'%20fill='%2323262c'/%3E%3Crect%20x='6'%20y='8'%20%20width='20'%20height='3.5'%20rx='1.75'%20fill='%233987e5'/%3E%3Crect%20x='6'%20y='14'%20width='12'%20height='3.5'%20rx='1.75'%20fill='%233987e5'/%3E%3Crect%20x='6'%20y='20'%20width='4'%20%20height='3.5'%20rx='1.75'%20fill='%23d03b3b'/%3E%3C/svg%3E" />
    <style>
      /* Set before the bundle parses, so a slow phone never flashes white. */
      html {
        background: #101114;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
