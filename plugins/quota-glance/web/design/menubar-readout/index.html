<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quota Glance · Menu bar readout: session + weekly</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
/* Design board for the Quota Glance menu bar status item (Swift/AppKit app in
   plugins/quota-glance-menubar). Self-contained: everything is drawn by the
   script at the end; the 1x/2x pixel captures are embedded PNG sprites.
   1 CSS px = 1 pt. Menu bar text uses the system font stack: Inter on this
   Linux machine, SF Pro on a Mac. */
:root{
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;
  --page:#121417;--card:#1a1d22;--card2:#20242a;--line:#2b3038;--ink:#eceef2;--muted:#a2a9b5;--faint:#737b88;--accent:#9cc2ff;--gold:#f2c879;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;color:var(--ink);font:13px/1.5 var(--sys);-webkit-font-smoothing:antialiased;font-synthesis:none}
h1,h2,h3,p,ul{margin:0}
code{font:11.5px/1.4 ui-monospace,"SF Mono",Menlo,monospace;color:#c9d3e2;background:#262b33;border-radius:4px;padding:0 3px}
.wrap{max-width:1620px;margin:0 auto;padding:32px 32px 40px}

/* ---------- header ---------- */
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.head h1{font-size:26px;font-weight:650;letter-spacing:-.6px}
.lede{color:var(--muted);margin-top:8px;max-width:720px;font-size:13.5px}
.lede b{color:var(--ink);font-weight:550}
.rec{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pick{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pick.top{border-color:#4d6a96;background:#18202c}
.pk{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:650;color:var(--faint)}
.pick.top .pk{color:var(--accent)}
.pick h3{font-size:16px;font-weight:650;margin-top:3px;letter-spacing:-.2px}
.pick .pv{display:flex;flex-direction:column;gap:3px;margin:10px 0 10px;border-radius:6px;overflow:hidden;width:max-content}
.pick ul{padding-left:17px;color:var(--muted);font-size:12.5px;line-height:1.55}
.pick li+li{margin-top:3px}
.pick b{color:var(--ink);font-weight:550}
.pick .pm{margin-top:9px;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.also{margin-top:12px;font-size:12.5px;color:var(--muted);max-width:760px}
.also b{color:var(--ink);font-weight:550}

table.sum{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sum th{font-weight:550;color:var(--faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.sum td{padding:6px 10px;border-bottom:1px solid #23272e;vertical-align:middle;color:var(--muted)}
.sum tr:last-child td{border-bottom:0}
.sum td:first-child{color:var(--ink);white-space:nowrap}
.sum td.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.sum td.prev{padding:4px 10px}
.sum .k{display:inline-block;min-width:20px;text-align:center;border:1px solid #3a404b;border-radius:4px;font-size:11px;color:#c4cbd6;margin-right:7px;padding:0 3px}
.sum tr.r1 td:first-child .k{border-color:#4d6a96;color:var(--accent)}
.pos{color:#f0b37a}.neg{color:#8fd19e}.zero{color:var(--muted)}
.eff{display:inline-block;min-width:22px;text-align:center;border-radius:4px;font-weight:600;font-size:11.5px;padding:0 4px}
.eff.S{background:#1f3a2a;color:#8fd19e}.eff.M{background:#3a3220;color:#f2c879}.eff.ML{background:#41302a;color:#f2b07f}.eff.dash{color:var(--faint)}
.sumnote{font-size:12px;color:var(--faint);margin-top:9px}

.notch{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.notch h3{font-size:13px;font-weight:600}
.notch p{font-size:12.5px;color:var(--muted);margin-top:6px}
.notch b{color:var(--ink);font-weight:550}
.notchbar{margin-top:10px;border-radius:6px;overflow:hidden}

.key{margin-top:26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.key h3{font-size:13px;font-weight:600;margin-bottom:8px}
.statekey{display:flex;flex-wrap:wrap;gap:6px}
.statekey span{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--muted)}
.statekey b{color:var(--ink);font-weight:550}
.rules{display:grid;gap:7px}
.rules div{display:grid;grid-template-columns:128px 1fr;gap:12px;font-size:12.5px;color:var(--muted)}
.rules b{color:var(--ink);font-weight:550}
.guide{margin-top:14px;font-size:12.5px;color:var(--muted)}
.guide b{color:var(--ink);font-weight:550}
.fontnote{margin-top:10px;font-size:12px;color:var(--faint)}

/* ---------- option cards ---------- */
.opt{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px 22px}
.opt.base{background:#17191d}
.opt.r1{border-color:#4d6a96}
.ohead{display:flex;align-items:flex-start;gap:14px;justify-content:space-between}
.ohead h2{font-size:18px;font-weight:650;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.letter{font-size:12px;border:1px solid #3d4450;border-radius:5px;padding:1px 7px;color:#c4cbd6;font-weight:600}
.rank{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:#232a35;color:var(--muted)}
.rank.r1{background:#203048;color:var(--accent)}.rank.r2{background:#2c2a20;color:var(--gold)}
.pitch{color:var(--muted);margin-top:4px;font-size:13.5px;max-width:880px}
.badges{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
.badge{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge b{color:var(--ink);font-weight:600}

.grid{margin-top:16px;display:grid;column-gap:18px;row-gap:12px;align-items:center}
.grid .ch{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;font-weight:550;padding-bottom:2px;line-height:1.35}
.grid .ch small{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:11px}
.grid .sep{grid-column:1/-1;border-top:1px dashed var(--line);margin:2px 0 -2px;font-size:11px;color:var(--faint);padding-top:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:550}
.slabel{font-size:12.5px;color:var(--ink);font-weight:550;line-height:1.3}
.slabel small{display:block;color:var(--faint);font-weight:400;font-size:11.5px;margin-top:2px}
.pair{display:flex;flex-direction:column;gap:4px}
.pxcol{display:flex;flex-direction:column;gap:4px;justify-self:start}
.px{display:block;border-radius:7px;background-repeat:no-repeat;image-rendering:pixelated}
.zoomwrap{border-radius:7px;overflow:hidden;justify-self:start}
.zoom{zoom:3}

.notes{margin-top:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 22px;border-top:1px solid var(--line);padding-top:14px}
.notes div{font-size:12.5px;color:var(--muted);line-height:1.55}
.notes h4{margin:0 0 3px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.notes b{color:var(--ink);font-weight:550}

.foot{margin-top:28px;color:var(--faint);font-size:12.5px;line-height:1.65;max-width:1100px}
.foot b{color:var(--muted);font-weight:550}
.foot h3{font-size:13px;color:var(--muted);font-weight:600;margin-top:14px}
.foot ul{padding-left:18px;margin-top:4px}
.foot li+li{margin-top:3px}

/* ---------- simulated macOS menu bar ---------- */
.mb{height:24px;display:flex;align-items:center;justify-content:flex-end;white-space:nowrap;overflow:hidden;padding-left:18px;
    font:400 13px/1 var(--sys);color:var(--fg);flex-shrink:0}
.mb.dark{--fg:rgba(255,255,255,.96);--fg2:rgba(255,255,255,.55);--fgL:rgba(255,255,255,.72);--fg3:rgba(255,255,255,.38);
  --track:rgba(255,255,255,.3);--ptrack:rgba(255,255,255,.13);--red:#ff453a;--hl:rgba(255,255,255,.22);
  background:linear-gradient(90deg,#2c3140 0%,#22252d 45%,#272530 100%)}
.mb.light{--fg:rgba(0,0,0,.86);--fg2:rgba(0,0,0,.5);--fgL:rgba(0,0,0,.64);--fg3:rgba(0,0,0,.32);
  --track:rgba(0,0,0,.2);--ptrack:rgba(0,0,0,.08);--red:#ff3b30;--hl:rgba(0,0,0,.11);
  background:linear-gradient(90deg,#d9dfe9 0%,#e8e9ee 45%,#e7e2ea 100%)}
.mb.dark.flat{background:#262a33}.mb.light.flat{background:#e4e6ec}
.mb.mini{justify-content:center;padding-left:0}
.mb.inactive .si{opacity:.5}                /* menu bar on an inactive display (approximate) */
.si{display:inline-flex;align-items:center;height:24px;padding:0 7px;flex-shrink:0;position:relative}
.si svg{display:block;flex-shrink:0}
.si.clk{padding-right:11px;letter-spacing:-.05px}
.qi.hl::before{content:"";position:absolute;left:0;right:0;top:1px;bottom:1px;border-radius:5px;background:var(--hl)}
.qc{display:inline-flex;align-items:center;height:24px;position:relative}
.qi.dis .qc{opacity:.45}                    /* NSStatusBarButton.appearsDisabled */
.ic{margin-right:7px}                       /* image-to-title gap of .imageLeading */
.n{font:500 12px/1 var(--sys);font-variant-numeric:tabular-nums;letter-spacing:0;white-space:pre}
.l{font:600 10px/1 var(--sys);color:var(--fg2);letter-spacing:.1px;margin-right:3px;position:relative;top:-.2px}
.gap{display:inline-block;width:7px}
.rs{font:500 12px/1 var(--sys);color:var(--fg2);font-variant-numeric:tabular-nums;margin-left:4px;white-space:pre}
.stk{display:grid;grid-template-columns:auto auto;align-items:baseline;column-gap:2.5px;line-height:9.5px}
.stk .l{font:700 9px/9.5px var(--sys);color:var(--fgL);margin:0;top:0;text-align:right}
.stk .n{font:650 10px/9.5px var(--sys);font-variant-numeric:tabular-nums;text-align:right}
</style>
</head>

// ---------------------------------------------------------------------------
// Option renderers: (state) -> inner HTML of the status item.
// ---------------------------------------------------------------------------
const num = (t, color = 'var(--fg)') => `<span class="n" style="color:${color}">${t}</span>`;
const lab = t => `<span class="l">${t}</span>`;

function lettered(st, icon, countdown){
  const val = v => st.stale ? num('—') : num(pad2(v), numInk(v));
  const cd = countdown && !st.stale && st.s === 0 && st.reset ? `<span class="rs">· ${st.reset}</span>` : '';
  return (icon ? ICON : '') + lab('S') + val(st.s) + cd + '<span class="gap"></span>' + lab('W') + val(st.w);
}

function stacked(st){
  const val = v => st.stale ? num('—') : num(pad2(v), numInk(v));
  return `<span class="stk">${lab('S')}${val(st.s)}${lab('W')}${val(st.w)}</span>`;
}

// A diagonal slash with a knocked-out gap, the SF Symbols ".slash" convention,
// used by the shape options for "no current reading" so it never reads as 0.
function slashed(W, H, body){
  const id = 'm' + (++uid);
  return `<defs><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="#fff"/><line x1="1" y1="${H - .5}" x2="${W - 1}" y2=".5" stroke="#000" stroke-width="3.4"/></mask></defs>`
       + `<g mask="url(#${id})">${body}</g><line x1="1.6" y1="${H - 1}" x2="${W - 1.6}" y2="1" stroke="var(--fg)" stroke-width="1.3" stroke-linecap="round"/>`;
}

// C. Live chart glyph: the app's chart.bar glyph cut to two bars whose heights
// are what is left (left session, right weekly), over the x-axis. 14 x 12 pt.
function glyphSVG(st){
  const W = 14, H = 12, bh = 10, bw = 5, id = 'g' + (++uid);
  let defs = '', body = '';
  [{v: st.s, x: 1}, {v: st.w, x: 8}].forEach((b, i) => {
    if (!st.stale && b.v == null) {             // missing: outline only
      body += `<rect x="${b.x + .5}" y=".5" width="${bw - 1}" height="${bh - 1}" rx="1" fill="none" stroke="var(--track)" stroke-width="1"/>`;
      return;
    }
    defs += `<clipPath id="${id}${i}"><rect x="${b.x}" y="0" width="${bw}" height="${bh}" rx="1.1"/></clipPath>`;
    let g = `<rect x="${b.x}" y="0" width="${bw}" height="${bh}" fill="var(--track)"/>`;
    if (!st.stale) {
      // Whole or half points; a spent or critical window keeps a red stub.
      const h = b.v === 0 ? 1 : Math.max(crit(b.v) ? 2 : 1, Math.round(bh * b.v / 100 * 2) / 2);
      g += `<rect x="${b.x}" y="${bh - h}" width="${bw}" height="${h}" fill="${numInk(b.v)}"/>`;
    }
    body += `<g clip-path="url(#${id}${i})">${g}</g>`;
  });
  body += `<rect x="0" y="11" width="${W}" height="1" fill="var(--fg)"/>`;
  // A critical or spent window also turns the axis under its bar red.
  [{v: st.s, x: 1}, {v: st.w, x: 8}].forEach(b => { if (!st.stale && crit(b.v)) body += `<rect x="${b.x}" y="11" width="${bw}" height="1" fill="var(--red)"/>`; });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs>${defs}</defs>${st.stale ? slashed(W, H, body) : body}</svg>`;
}

// D. Split pill: number in the label colour, a 2pt gauge under it. 49 x 18 pt.
function pillSVG(st){
  const W = 49, H = 18, seg = 24, id = 'p' + (++uid);
  let body = '';
  [{v: st.s, x: 0}, {v: st.w, x: seg + 1}].forEach(p => {
    const none = st.stale || p.v == null;
    body += `<rect x="${p.x}" width="${seg}" height="${H}" fill="var(--ptrack)"/>`
          + `<text x="${p.x + seg / 2}" y="10.5" text-anchor="middle" style="font:700 10.5px var(--sys);font-variant-numeric:tabular-nums" fill="var(--fg)">${none ? '—' : p.v}</text>`
          + `<rect x="${p.x + 4}" y="13" width="16" height="2" rx="1" fill="${!none && crit(p.v) ? 'color-mix(in srgb, var(--red) 45%, transparent)' : 'var(--track)'}"/>`;
    if (!none) {
      const fw = p.v === 0 ? 1.5 : Math.max(crit(p.v) ? 1.5 : 1, Math.round(16 * p.v / 100 * 2) / 2);
      body += `<rect x="${p.x + 4}" y="13" width="${fw}" height="2" rx="${fw >= 2 ? 1 : 0}" fill="${numInk(p.v)}"/>`;
    }
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><clipPath id="${id}"><rect width="${W}" height="${H}" rx="5"/></clipPath></defs><g clip-path="url(#${id})">${body}</g></svg>`;
}

// E. Twin rings: two 12pt rings, butt caps, neutral tracks. 27 x 12 pt.
function ringsSVG(st){
  const W = 27, H = 12, R = 5, sw = 2;
  const ring = (cx, v) => {
    const c = `cx="${cx}" cy="6" r="${R}" fill="none"`;
    if (!st.stale && v == null) return `<circle ${c} stroke="var(--track)" stroke-width="1"/>`;
    let g = `<circle ${c} stroke="var(--track)" stroke-width="${sw}"/>`;
    if (!st.stale) {
      const p = v >= 100 ? 100 : crit(v) ? Math.max(v, 10) : v;
      g += `<circle ${c} stroke="${numInk(v)}" stroke-width="${sw}" pathLength="100" stroke-dasharray="${p} 100" stroke-linecap="butt" transform="rotate(-90 ${cx} 6)"/>`;
    }
    return g;
  };
  const body = ring(6, st.s) + ring(21, st.w);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${st.stale ? slashed(W, H, body) : body}</svg>`;
}

const RANKED = OPTIONS.filter(o => o.rank);
const COL_IDS = [...STATES.map(s => s.id), 'icon', 'countdown', 'hl', 'inactive'];
const rowsFor = o => [...STATES.map(s => ({id: s.id, label: s.label, sub: s.sub, st: s})), ...(o.extra || []), ...COMMON_ROWS];

// ---------------------------------------------------------------------------
// Building blocks
// ---------------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const only = params.get('only');
const capture = params.get('capture');

const item = (o, row) => `<span class="si qi${row.st.stale && !o.base ? ' dis' : ''}${row.hl ? ' hl' : ''}"><span class="qc">${(row.render || o.render)(row.st)}</span></span>`;
const strip = (o, row, theme) => `<div class="mb ${theme}${row.inactive ? ' inactive' : ''}"><span class="si">${CLOUD}</span>${item(o, row)}<span class="si">${MOON}</span><span class="si">${BATT}</span><span class="si">${WIFI}</span><span class="si">${CC}</span><span class="si clk">${CLOCK}</span></div>`;
const mini = (o, row, theme, w) => `<div class="mb ${theme} flat mini${row.inactive ? ' inactive' : ''}" style="width:${w}px">${item(o, row)}</div>`;
const fmt = v => (Number.isInteger(v) ? v : v.toFixed(1)) + 'pt';
const effHTML = (e) => `<span class="eff ${e === '—' ? 'dash' : e === 'M–L' ? 'ML' : e}">${e}</span>`;

// Pixel captures: SPRITES holds two screenshots of ?capture=1 (device scale 1
// and 2) and the layout they were taken with. If they are missing or out of
// date, the magnified columns fall back to a vector re-render and say so.
let SPR = null;
function spritesUsable(){
  if (!SPRITES || !SPRITES.layout) return false;
  const L = SPRITES.layout;
  return JSON.stringify(L.cols) === JSON.stringify(COL_IDS)
      && JSON.stringify(L.rows) === JSON.stringify(spriteRows())
      && OPTIONS.every(o => L.crop[o.key]);
}
const spriteRows = () => OPTIONS.flatMap(o => ['dark', 'light'].map(t => o.key + '-' + t));
function pxCell(o, row, theme, dens){
  if (!SPR) return `<div class="zoomwrap"><div class="zoom">${mini(o, row, theme, o._crop)}</div></div>`;
  const L = SPR.layout, cw = L.crop[o.key];
  const x = L.cols.indexOf(row.id) * L.cellW + (L.cellW - cw) / 2, y = L.rows.indexOf(o.key + '-' + theme) * L.cellH;
  return `<div class="px d${dens}" style="width:${cw * 3}px;height:${L.cellH * 3}px;background-size:${L.sheetW * 3}px ${L.sheetH * 3}px;background-position:${-x * 3}px ${-y * 3}px"></div>`;
}

// ---------------------------------------------------------------------------
// Measurement (Inter here, SF Pro on a Mac)
// ---------------------------------------------------------------------------
let host;
function measureRow(o, row){
  host.innerHTML = `<div class="mb dark" style="width:900px">${item(o, row)}</div>`;
  return {content: host.querySelector('.qc').getBoundingClientRect().width, outer: host.querySelector('.qi').getBoundingClientRect().width};
}
const half = v => Math.round(v * 2) / 2;
function measureAll(){
  host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:-9999px;top:0';
  document.body.appendChild(host);
  const ext = [{id:'x', st:{s:100, w:100}}, {id:'x', st:{s:100, w:0}}, {id:'x', st:{s:0, w:100}}];
  for (const o of OPTIONS) {
    o._outer = {};
    o._content = {};
    for (const row of rowsFor(o)) { const m = measureRow(o, row); o._outer[row.id] = m.outer; o._content[row.id] = m.content; }
    o._w = half(o._content.normal);
    o._max = half(Math.max(...STATES.map(s => o._content[s.id]), ...ext.map(r => measureRow(o, r).content)));
    o._stale = half(o._content.stale);
    const crop = Math.ceil(Math.max(...Object.values(o._outer)) + 12);
    o._crop = Math.max(56, crop + (crop % 2));
  }
  host.remove();
}
function layout(){
  const crop = {};
  OPTIONS.forEach(o => crop[o.key] = o._crop);
  const cellW = Math.max(...Object.values(crop));
  return {v: 2, cellW, cellH: 24, cols: COL_IDS, rows: spriteRows(), crop, sheetW: cellW * COL_IDS.length, sheetH: 24 * spriteRows().length};
}
// Status items sit on whole points: round every item's width up.
function snapItems(root){
  root.querySelectorAll('.si').forEach(el => { if (!el.closest('.zoom')) el.style.width = Math.ceil(el.getBoundingClientRect().width) + 'px'; });
}

        <div class="pick"><div class="pk">Runner-up</div><h3>B · Stacked micro</h3>
          <div class="pv">${pv(B, NORMAL, 'dark')}${pv(B, STATES[1], 'light')}</div>
          <ul>
            <li><b>Both labelled values in ${fmt(B._w)}</b>, ${delta(B)[1].replace('−', '')} narrower than today: the pick for a crowded, notched MacBook.</li>
            <li><b>Costs:</b> 9–10pt type is marginal on a 1× external display, and a status item title is one line, so it needs two text fields inside the button (or a drawn image).</li>
          </ul>
          <div class="pm">Effort: ${effHTML('M')} on its own, ${effHTML('M–L')} in total.</div></div>
      </div>
      <p class="also">If a shape is enough and the tooltip can carry the numbers: <b>C · Live chart glyph</b>, which is icon-sized and on brand. <b>D · Split pill</b> and <b>E · Twin rings</b> work, but are weaker; their cards say why.</p>
    </div>
    <div>
      <table class="sum" id="sum"><thead><tr><th>Option</th><th>Normal, dark, actual size</th><th style="text-align:right">Width</th><th style="text-align:right">At 100</th><th style="text-align:right">vs today</th><th>Effort (own → total)</th></tr></thead><tbody>${summaryRows()}</tbody></table>
      <p class="sumnote">Width is the drawn content in points, measured on this page in Inter at 94/59; real SF Pro is slightly narrower. “At 100” is the widest a value can make it: text options keep <code>.variableLength</code> with figure-space padding, so they only grow at 100; shape options are fixed. The status item adds the same padding to every option. Effort totals include the shared two-window work, which is about M on its own.</p>
      <div class="notch">
        <h3>The notch, and crowded bars on any Mac</h3>
        <p>On notched MacBooks, status items line up leftwards from the clock, and any item that would cross the notch is hidden, with no overflow menu. Third-party items such as Quota Glance sit left of the system items, so they are the first to go. On a 14-inch MacBook Pro at default scaling, roughly (1512 − ~187) / 2 ≈ <b>660pt</b> right of the notch is shared by every item, system ones included.</p>
        <p>Width matters without a notch too: Apple’s HIG (“The menu bar”) says the system hides menu bar extras to make room for app menus, and hides some when there are too many. An app with long menus can push the item off any display. ⌘-dragging the item rightwards keeps it visible longer.</p>
        <div class="notchbar mb dark" id="notchdemo"></div>
        <p>Above, to scale: option A among a few third-party items and the system items. The notch is drawn about 185pt wide; the real width varies by model.</p>
      </div>
    </div>
  </section>
  <section class="key">
    <div>
      <h3>States drawn for every option</h3>
      <div class="statekey">${STATES.map(s => `<span><b>${s.label}</b> · ${s.sub}</span>`).join('')}</div>
      <p class="guide"><b>How to read a card.</b> <b>Actual size:</b> live HTML at 1 pt = 1 px, between a third-party item (cloud) on the left and the system items on the right; on a Retina Mac this draws at 2×, like the real bar. <b>1× pixels</b> and <b>2× pixels:</b> screenshots of this page captured at device scale 1 and 2, magnified 3× without smoothing, so they show the real pixel blur of a non-Retina external display and of a Retina MacBook. They are captures in Inter on Linux, so expect SF Pro on a Mac to be a touch narrower and crisper.</p>
      <p class="fontnote">Fonts: this machine has no SF Pro, so text renders in Inter (loaded from rsms.me) as a stand-in. Opened on a Mac, the actual-size column renders in real SF Pro. SF Symbols are hand-drawn SVG approximations. The highlight and inactive-display rows are approximations of the system look.</p>
    </div>
    <div>
      <h3>Rules shared by every option</h3>
      <div class="rules">
        <div><b>Order</b><span>Session first (left or top), weekly second. The same everywhere.</span></div>
        <div><b>Colour</b><span>Monochrome template until the server says <code>level: "critical"</code> (≤10%). Then only that value turns system red: the number in text options, the fill in shape options (plus the axis under C’s bar and D’s 2pt gauge track). Labels, numbers in D, and C/E tracks stay neutral, so nothing red reads as full.</span></div>
        <div><b>A low weekly</b><span>Does not dim the session. The server keeps counting each session until its weekly is <i>spent</i> (<code>gatedBy</code> in <code>internal/aggregate/weekly.go</code>), so “S 94 · W 4” is the real reading and the red weekly carries the warning. Once every weekly is spent, the server reports the session as 0% too.</span></div>
        <div><b>Missing vs stale</b><span>A window with no reading (<code>remainingPercent</code> is null for that row) shows “—” on its own, at full strength. Only a stale or failed snapshot dims the whole item (<code>appearsDisabled</code>).</span></div>
        <div><b>Width</b><span>Keep <code>.variableLength</code> as today and pad 0–9 with U+2007 FIGURE SPACE, so the item only grows at 100. A “—” is about 2pt narrower than two digits.</span></div>
      </div>
    </div>
  </section>`;
}

function summaryRows(){
  return OPTIONS.map(o => {
    const [cls, txt] = delta(o);
    const rank = o.rank === 1 ? ' · recommended' : o.rank === 2 ? ' · runner-up' : '';
    return `<tr class="${o.rank === 1 ? 'r1' : ''}"><td><span class="k">${o.letter}</span>${o.name}<span style="color:var(--faint)">${rank}</span></td>`
         + `<td class="prev"><div class="mb dark" style="width:max-content;border-radius:5px;padding:0 3px">${item(o, {st: NORMAL})}</div></td>`
         + `<td class="num">${fmt(o._w)}</td><td class="num">${fmt(o._max)}</td><td class="num ${cls}">${txt}</td>`
         + `<td>${effHTML(o.eff)}${o.base ? '' : ` → ${effHTML(o.total)}`} <span style="color:var(--faint)">${o.shows}</span></td></tr>`;
  }).join('');
}

function card(o){
  const cw = SPR ? SPR.layout.crop[o.key] : o._crop;
  const pxHead = SPR ? ['1× pixels, magnified 3×', 'Non-Retina display · dark over light', '2× pixels, magnified 3×', 'Retina display · dark over light']
                     : ['3× vector re-render', 'Pixel captures not embedded; sharper than real pixels', '3× vector re-render', 'Light'];
  let g = `<div class="ch"></div><div class="ch">Actual size<small>1 pt = 1 px · dark over light</small></div>`
        + `<div class="ch">${pxHead[0]}<small>${pxHead[1]}</small></div><div class="ch">${pxHead[2]}<small>${pxHead[3]}</small></div>`;
  const rows = rowsFor(o);
  rows.forEach((row, i) => {
    if (i === STATES.length) g += `<div class="sep">Variants and system states</div>`;
    const px = SPR ? `<div class="pxcol">${pxCell(o, row, 'dark', 1)}${pxCell(o, row, 'light', 1)}</div><div class="pxcol">${pxCell(o, row, 'dark', 2)}${pxCell(o, row, 'light', 2)}</div>`
                   : `<div class="pxcol">${pxCell(o, row, 'dark')}</div><div class="pxcol">${pxCell(o, row, 'light')}</div>`;
    g += `<div class="slabel">${row.label}<small>${row.sub}</small></div><div class="pair">${strip(o, row, 'dark')}${strip(o, row, 'light')}</div>${px}`;
  });
  const n = o.notes, [cls, txt] = delta(o);
  const rk = o.rank === 1 ? '<span class="rank r1">Recommended</span>' : o.rank === 2 ? '<span class="rank r2">Runner-up</span>' : o.rank ? `<span class="rank">Rank ${o.rank}</span>` : '<span class="rank">Baseline</span>';
  const extraW = o.extra ? ' ' + o.extra.map(r => `${r.label.replace('Variant: ', '“')}” variant: ${fmt(half(o._content[r.id]))}.`).join(' ') : '';
  const cost = o.base ? '' : Math.abs(o._w - OPTIONS[0]._w) < 4 ? ' About the same room as today.' : o._w > OPTIONS[0]._w ? ` It takes ${txt.slice(1)} more than today, out of the shared budget beside the notch.` : ` It frees ${txt.slice(1)} compared with today.`;
  return `<section class="opt${o.base ? ' base' : ''}${o.rank === 1 ? ' r1' : ''}" id="opt-${o.key}" data-key="${o.key}">
    <div class="ohead"><div><h2><span class="letter">${o.letter}</span>${o.name}${rk}</h2><p class="pitch">${o.pitch}</p></div>
      <div class="badges"><span class="badge">Width <b>${fmt(o._w)}</b></span><span class="badge">At 100 <b>${fmt(o._max)}</b></span><span class="badge">vs today <b class="${cls}">${txt}</b></span><span class="badge">Effort <b>${o.eff}</b>${o.base ? '' : ` → total <b>${o.total}</b>`}</span></div></div>
    <div class="grid" style="grid-template-columns:150px max-content ${cw * 3}px ${cw * 3}px">${g}</div>
    <div class="notes">
      <div><h4>Build it (AppKit)</h4>${n.build}</div>
      <div><h4>States and colour</h4>${n.states}</div>
      <div><h4>Width and space</h4><b>${fmt(o._w)}</b> at rest, ${fmt(o._max)} at 100, ${fmt(o._stale)} when stale.${cost}${extraW} ${n.notch}</div>
      <div><h4>VoiceOver and tooltip</h4>${n.a11y}</div>
      <div><h4>Settings</h4>${n.settings}</div>
      <div><h4>Effort</h4>${n.effort}</div>
    </div>
  </section>`;
}

function footer(){
  return `<section class="foot">
    <h3>Shared work for any option (about M on its own)</h3>
    <ul>
      <li><code>AppSettings</code>: store <code>menuBarQuotas: [QuotaSelection]</code> (or a preset), and keep reading the existing <code>menuBarQuota</code> key as a one-item list so current installs keep their choice.</li>
      <li>Settings: add “Claude · Session + Weekly” to the single <code>quotaPicker</code> when both rows exist. Add a style pop-up only if more than one option ships.</li>
      <li><code>QuotaReadoutState.presentation</code>: return a value, level and “missing” flag per window, plus whole-item staleness. Extend <code>QuotaReadoutTests</code> to two windows, one missing, and stale.</li>
      <li><code>QuotaReadout.js</code> and <code>QuotaWindow</code>: project and decode the server’s <code>aggregate.level</code>, so the menu bar uses the server’s thresholds rather than a hard-coded 10%. The countdown variant would also need <code>soonestResetAtEpoch</code>. It still projects only labels and numbers, never headers.</li>
      <li><code>updateReadout()</code>: the two-value title or image, <code>appearsDisabled</code> for stale, and a tooltip and accessibility label that say “remaining”. Consider <code>button.highlight(true)</code> while the popover is open; the app does not do that today.</li>
    </ul>
    <h3>Weekly (Fable)</h3>
    <p>Claude has a third window, which the server caps at whatever each account’s weekly has left. A extends with a third pair (“F 72”, about 30pt more). C takes a third bar naturally, since the real glyph has four. D and E grow by one segment or ring. B cannot fit three legible rows in 24pt.</p>
    <h3>Set aside after review</h3>
    <ul>
      <li><b>Icon + pair</b> (“94 · 59%”): folded into A as the “with icon” variant. It was the widest option, “94 · 59%” read as two different units, and the faint dot vanished at 1×.</li>
      <li><b>Lowest wins</b> (one value, S or W): it still shows only one value, so it fails the brief. Its reset countdown lives on as a tooltip line or A’s countdown variant.</li>
      <li><b>Horizontal twin bars</b>: at 1× and 2× they were a near-twin of the Control Center glyph that always sits by the clock. Replaced by C’s vertical bars.</li>
      <li><b>Concentric rings</b>: the inner ring was a 9px blob at 1×, and round caps made 91% and up look full. Replaced by E’s side-by-side rings with butt caps.</li>
      <li><b>“Dim the session when the weekly is low”</b>: it contradicted the server, which keeps the session’s figure until the weekly is spent, and the dimmed number looked stale.</li>
      <li>Two separate status items (they hide independently, so one can vanish behind the notch while the other stays), and a readout that alternates between the two (motion in the menu bar, and you can’t read it at a glance).</li>
    </ul>
    <h3>Sources</h3>
    <p><code>plugins/quota-glance-menubar/Sources/QuotaGlance/AppDelegate.swift</code> (<code>updateReadout</code>), <code>SettingsWindowController.swift</code> (<code>quotaPicker</code>), <code>Sources/GlanceCore/QuotaReadout.swift</code>, <code>Resources/QuotaReadout.js</code> (nullable <code>remainingPercent</code>). Server: <code>plugins/quota-glance/internal/aggregate/weekly.go</code> (<code>gatedBy</code>), <code>build.go</code> (levels). Apple HIG, “The menu bar” (24pt height, menu bar extras, black-and-clear template images).</p>
  </section>`;
}

function buildCapture(){
  const L = layout();
  let html = `<div id="sheet" style="position:relative;width:${L.sheetW}px;height:${L.sheetH}px;background:#000">`;
  OPTIONS.forEach((o, oi) => ['dark', 'light'].forEach((t, ti) => {
    const y = (oi * 2 + ti) * L.cellH;
    rowsFor(o).forEach(row => {
      const x = L.cols.indexOf(row.id) * L.cellW, left = Math.round((L.cellW - Math.ceil(o._outer[row.id])) / 2);
      html += `<div class="mb ${t} flat${row.inactive ? ' inactive' : ''}" style="position:absolute;left:${x}px;top:${y}px;width:${L.cellW}px;padding-left:${left}px;justify-content:flex-start">${item(o, row)}</div>`;
    });
  }));
  document.body.style.margin = '0';
  document.getElementById('app').outerHTML = html + '</div>';
  snapItems(document.body);
  window.__layout = L;
}

function build(){
  measureAll();
  if (capture) { buildCapture(); return; }
  SPR = spritesUsable() ? SPRITES : null;
  if (SPR) {
    const css = document.createElement('style');
    css.textContent = `.px.d1{background-image:url("${SPR.x1}")}.px.d2{background-image:url("${SPR.x2}")}`;
    document.head.appendChild(css);
  }
  const app = document.getElementById('app');
  if (only === 'head') app.innerHTML = header();
  else if (only) app.innerHTML = OPTIONS.filter(o => o.key === only).map(card).join('');
  else app.innerHTML = header() + OPTIONS.map(card).join('') + footer();
  const demo = document.getElementById('notchdemo');
  if (demo) {
    const third = ['<svg width="15" height="14" viewBox="0 0 15 14"><rect x="1.5" y="1.5" width="11" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 7h5M7 4.5v5" stroke="currentColor" stroke-width="1.5"/></svg>',
                   '<svg width="16" height="12" viewBox="0 0 16 12"><path fill="currentColor" d="M1 6l4-5h6l4 5-4 5H5z" opacity=".9"/></svg>', CLOUD];
    demo.style.cssText = 'justify-content:flex-start;padding-left:0';
    demo.innerHTML = `<span class="si" style="width:185px;background:#000;border-radius:0 0 10px 10px;justify-content:center;color:#555;font:500 10.5px/1 var(--sys)">notch</span><span style="flex:1"></span>`
      + third.map(s => `<span class="si">${s}</span>`).join('') + item(byKey('a'), {st: NORMAL})
      + `<span class="si">${MOON}</span><span class="si">${BATT}</span><span class="si">${WIFI}</span><span class="si">${CC}</span><span class="si clk">${CLOCK}</span>`;
  }
  snapItems(app);
}

(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  // Inter is a web font: make sure the weights used here have loaded before measuring.
  const loads = ['500 12px Inter', '600 10px Inter', '650 10px Inter', '700 9px Inter', '700 10.5px Inter', '400 13px Inter']
    .map(f => document.fonts.load(f, '0123456789SW—%· hm'));
  return Promise.all(loads).catch(() => {});
}).then(() => { build(); document.documentElement.dataset.ready = '1'; });
</script>
