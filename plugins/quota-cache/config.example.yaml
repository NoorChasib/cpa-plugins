# Set these on CPA's Plugins page: open Quota Cache's Edit config, which
# shows them under Config fields in the Configure quota-cache dialog. If you
# edit config.yaml instead, merge these fields into the existing plugin
# configuration; preserve all other options.
plugins:
  enabled: true
  configs:
    quota-cache:
      enabled: true
      cache-path: /CLIProxyAPI/plugins/data/quota-cache/snapshot.json
      poll-interval: 15m
      request-spacing: 10s
      # Optional Claude session priming. CPA (v8.0.4 or newer) sends each
      # warm-up through the Claude account it already holds; see
      # docs/claude-warmup.md. All fields are also available in
      # Plugins -> Quota Cache -> Edit config. warmup-cli-path and
      # warmup-profile-root, from 0.3.0, are accepted and ignored.
      warmup-enabled: false
      warmup-model: claude-haiku-5-5
      warmup-effort: low
      warmup-hours: 00:00-24:00
      warmup-timezone: UTC
      # Optional. An OpenRouter management key, for reading your account
      # balance (Quota Glance shows it). Create it at
      # https://openrouter.ai/settings/management-keys and give it an expiry:
      # it can also create and delete your API keys. Empty disables it.
      # openrouter-management-key: sk-or-v1-...
      # Claude API credits: since 0.2.0, the Claude Console organizations are
      # added on Quota Cache's own page in CPA's sidebar, with their monthly
      # credits, refill dates and Console readings; Edit config does not
      # offer them. Quota Cache counts each organization's Claude API-key
      # traffic as CPA serves it (CPA v8.0.4 or newer) and asks Anthropic
      # nothing; no key goes here or there.
      #
      # claude-api-credits is where Quota Cache 0.1.13 and 0.1.14 listed the
      # organizations. 0.2.0 accepts it and ignores it: nothing moves from it
      # to the page, and CPA's log says once per load that it is ignored.
      # Leaving it keeps a rollback simple, since 0.1.14 reads it; before
      # rolling back, make it list the page's organizations:
      # claude-api-credits:
      #   - label: personal-1               # your name for it; unique
      #     # The Organization ID from Console under Settings > Organization.
      #     organization-id: "12345678-1234-5678-1234-567812345678"
      #     monthly-usd: "200"              # optional, read only by 0.1.14
      #     renews: "2026-10-29"            # optional, read only by 0.1.14
    account-health-pushover:
      # Requires the updated consumer binary; old published releases do not use this option.
      quota-cache-path: /CLIProxyAPI/plugins/data/quota-cache/snapshot.json
      # Keep your existing quota-alerts preference. true enables notifications from cached data.
    reset-priority:
      # Requires the updated consumer binary.
      quota-cache-path: /CLIProxyAPI/plugins/data/quota-cache/snapshot.json
