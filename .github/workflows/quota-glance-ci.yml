name: Quota Glance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quota-glance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.1'
          cache-dependency-path: plugins/*/go.sum
      # The dashboard bundle is committed so `go build` never needs Node, but
      # `make ci` rebuilds it to prove the committed copy is not stale. pnpm
      # comes from corepack, which ships with Node, so this adds no third-party
      # action to the supply chain. The version is pinned by `packageManager`
      # in web/package.json.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable
      - name: Unit, race, import-boundary checks, bundle freshness and native build
        run: make -C plugins/quota-glance ci
      # The web app develops against the committed golden documents. A build
      # that no longer reproduces them byte for byte is a contract change, and
      # must be an explicit `make golden` commit rather than silent drift.
      # --exit-code alone is not enough: an untracked file passes it silently,
      # so the files are asserted to be tracked first.
      - name: Golden documents are tracked, reproducible, and committed
        run: |
          git ls-files --error-unmatch \
            plugins/quota-glance/testdata/golden/summary.json \
            plugins/quota-glance/testdata/golden/summary-degraded.json
          make -C plugins/quota-glance golden
          git diff --exit-code -- plugins/quota-glance/testdata/golden/
      # The menu bar's bridge reads the healthy golden document and pins figures
      # from it, but its own workflow runs only for changes under its directory.
      # Its JavaScript tests need nothing but Node, so they run here too: a
      # golden change that breaks the menu bar fails in the same push.
      - name: Menu bar bridge still reads the golden document
        run: node --test plugins/quota-glance-menubar/scripts/tests/*.test.mjs
      # Every other check in this suite calls Handle() in process. Only this one
      # proves the shared library loads, that CPA accepts the ABI handshake,
      # that the routes are registered where we think, and that the plugin
      # unloads without wedging the proxy.
      - name: Native load, serve, reload, restart and unload inside real CPA
        run: |
          docker pull eceasy/cli-proxy-api@sha256:72205ea2dff7e3e3ef23b03de4e17b169ff7449c02b12f2924a3d4d3eee68b7d
          make -C plugins/quota-glance smoke
      # quota-glance imports the quota-cache client directly from the monorepo,
      # so a change to that client has to keep both consumers building.
      - name: Quota Cache client contract
        run: |
          make -C plugins/quota-cache fmt-check vet race
          make -C plugins/account-health-pushover test
          make -C plugins/reset-priority test
