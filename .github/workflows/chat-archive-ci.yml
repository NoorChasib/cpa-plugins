name: Chat Archive native acceptance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: chat-archive-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
      AGENT_BROWSER_ARGS: --no-sandbox
    defaults:
      run:
        working-directory: plugins/chat-archive
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      # Same pinned actions as token-usage-ci.yml.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Require the selected Go toolchain
        run: test "$(go env GOVERSION)" = go1.27.1
      - name: Install exact test-only Node with verified integrity
        run: |
          bash scripts/browser/install-node.sh "$RUNNER_TEMP/chat-archive-node"
          printf '%s\n' "$RUNNER_TEMP/chat-archive-node/bin" >> "$GITHUB_PATH"
      - name: Install locked browser CLI and pinned Chrome
        run: make browser-tools
      - name: DIAG make vet then make test x5 after the real setup (diagnostic branch only)
        run: |
          make vet > "$RUNNER_TEMP/vet.log" 2>&1 && echo "vet ok" || echo "vet FAIL"
          fails=0
          for i in 1 2 3 4 5; do
            if make test > "$RUNNER_TEMP/test-$i.log" 2>&1; then echo "make test $i ok"; else echo "make test $i FAIL"; fails=$((fails+1)); grep -E -- '--- FAIL|DIAG|abi_test.go|panic|^FAIL' "$RUNNER_TEMP/test-$i.log" | head -90; fi
          done
          echo "make test fails: $fails of 5"
