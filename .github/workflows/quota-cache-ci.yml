name: Quota Cache and consumer integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quota-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.1'
          cache-dependency-path: plugins/*/go.sum
      - name: Cache unit/race checks and native build
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check-catalog.py
          make -C plugins/quota-cache ci
      - name: Native callback, reconfiguration, restart, and real-browser sidebar checks
        run: bash scripts/verify-quota-sidebar.sh
      - name: Consumer regression checks and native builds
        run: |
          make -C plugins/account-health-pushover ci c-shared
          make -C plugins/reset-priority fmt-check vet test race build
          make -C plugins/auto-baseline build
          make -C plugins/token-usage c-shared
          # build, not ci: the coexistence smoke below loads every plugin's
          # library, and quota-glance's ci rebuilds its dashboard bundle, which
          # would drag Node into a workflow that otherwise needs only Go. The
          # bundle is committed, so build embeds the current one either way.
          make -C plugins/quota-glance build
      - name: Pinned CPA coexistence, private routes, persistence, and restart
        run: |
          docker pull eceasy/cli-proxy-api@sha256:3990e4de484ac5caac80164ee3a60d0ba521320dcda193a2ef71a5ad2e2c768b
          python3 scripts/quota-cache-smoke.py
