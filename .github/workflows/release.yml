name: Publish verified Token Usage 0.1.0

on:
  push:
    tags: [v0.1.0]

permissions:
  contents: read

concurrency:
  group: token-usage-release-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'NoorChasib/cpa-plugin-token-usage' && github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0' && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The only writable job. GH_TOKEN is exported only for explicit gh steps.
    permissions:
      contents: write
    env:
      RELEASE_REPO: NoorChasib/cpa-plugin-token-usage
      RELEASE_TAG: v0.1.0
      RELEASE_VERSION: 0.1.0
      GH_PROMPT_DISABLED: '1'
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      # Official tag refs verified with git ls-remote on 2026-09-09.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard repository, version, tag, and main ancestry
        run: |
          test "$GITHUB_REPOSITORY" = "$RELEASE_REPO"
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python3 -c 'import json; assert json.load(open("registry.json"))["plugins"][0]["version"] == "0.1.0"'
      - name: Refuse any existing release or draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$RELEASE_REPO/releases" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id' > "$RUNNER_TEMP/existing-release"
          if test -s "$RUNNER_TEMP/existing-release"; then
            printf 'Release or draft already exists; refusing to overwrite it.\n' >&2
            exit 1
          fi
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Require the selected Go toolchain
        run: test "$(go env GOVERSION)" = go1.27.1
      - name: Full formatting, static, unit, race, and build checks
        run: make ci VERSION="$RELEASE_VERSION"
      - name: Required pinned CPA native, production SQLite, and restart acceptance
        run: |
          make smoke | tee "$RUNNER_TEMP/native-smoke.log"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import shutil
          log = (Path(os.environ["RUNNER_TEMP"]) / "native-smoke.log").read_text()
          matches = re.findall(r"^Pinned CPA source/build/runtime artifacts: (/tmp/token-usage-smoke\.[A-Za-z0-9]+)$", log, re.M)
          if len(matches) != 1:
              raise SystemExit("expected exactly one native smoke work directory")
          work = Path(matches[0])
          shutil.copyfile(work / "token-usage-production.so", "dist/token-usage.so")
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write(f"CPA_SMOKE_WORK={work}\n")
          PY
      - name: Package the exact tested bytes and rehearse both CPA installers
        run: |
          make package-tested checksums verify-release VERSION="$RELEASE_VERSION"
          cmp "$CPA_SMOKE_WORK/token-usage-production.so" dist/token-usage.so
          (cd dist && sha256sum -c checksums.txt)
          readelf --version-info dist/token-usage.so
          python3 scripts/verify-cpa-package.py --cpa-source "$CPA_SMOKE_WORK/source"
          git diff --exit-code -- registry.json
      - name: Create draft with all validated release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" --verify-tag --draft \
            --title "Token Usage $RELEASE_VERSION" --notes-file docs/release-notes-0.1.0.md \
            "dist/token-usage_${RELEASE_VERSION}_linux_amd64.zip" dist/checksums.txt dist/registry.json
      - name: Download and revalidate the draft before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json isDraft,tagName,assets > "$RUNNER_TEMP/draft.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          draft = json.loads((Path(os.environ["RUNNER_TEMP"]) / "draft.json").read_text())
          assert draft["isDraft"] and draft["tagName"] == "v0.1.0"
          names = [asset["name"] for asset in draft["assets"]]
          assert sorted(names) == ["checksums.txt", "registry.json", "token-usage_0.1.0_linux_amd64.zip"]
          PY
          downloaded=$(mktemp -d "$RUNNER_TEMP/release-download.XXXXXXXX")
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" --dir "$downloaded"
          for name in "token-usage_${RELEASE_VERSION}_linux_amd64.zip" checksums.txt registry.json; do
            cmp "dist/$name" "$downloaded/$name"
          done
          cp "$CPA_SMOKE_WORK/token-usage-production.so" "$downloaded/token-usage.so"
          (cd "$downloaded" && sha256sum -c checksums.txt)
          python3 scripts/release.py verify --version "$RELEASE_VERSION" --dist "$downloaded"
          python3 scripts/verify-cpa-package.py --cpa-source "$CPA_SMOKE_WORK/source" --dist "$downloaded"
      - name: Publish the validated draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json isDraft --jq '.isDraft')" = true
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --verify-tag --draft=false --latest
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json isDraft --jq '.isDraft' | grep -Fx false
